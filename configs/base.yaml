# Ortak ayarlar. "null" olan değerler tahminle doldurulmaz; ilgili görevde ölçülür.
project: turkce-yazim-duzeltici
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs

data:
  gecturk:
    hf_id: GGLab/GECTurk            # doğrulandı: train, dev, test, movie_reviews (parquet, Apache-2.0)
  oscar_gec:
    source: https://github.com/asimokby/Turkish-GEC
    hf_id_train: asimokby/Turkish-OSCAR-GEC          # train.csv + val.csv, MIT (rapor 01)
    hf_id_test: asimokby/Turkish-GEC-Evaluation      # 2.408 cümle, M2 (ERRANT-TR), MIT
    streaming: true                 # 2,3 milyon cümlenin tamamı indirilmez
  tweets:
    source: https://github.com/atubakoksal/annotated_tweets   # data.txt, 2.000 tweet, lisans yok (rapor 01)

sampling:
  gecturk_n: 12000                  # D1 ve D2'de aynı GECTurk alt kümesi kullanılır
  oscar_n: 12000                    # yalnızca D2
  clean_ratio: 0.5
  min_per_rule: 50
  oscar_dev_size: 500               # eşik ve model seçimi için; test setlerine dokunulmaz

model:
  candidates:                       # kimlik ve lisans doğrulandı (rapor 00); sohbet şablonu görev 03'te denenir
    - vngrs/Kumru-2B                # eski kimlik vngrs-ai/Kumru-2B yönlendiriyor; 2,38B parametre
    - Qwen/Qwen3-1.7B
  chosen: null                      # Kapı B'de doldurulur, sonra değişmez

training:
  max_len: null                     # görev 03: token uzunluğu ölçülüp %95'lik dilime göre konur
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 0.0002
  epochs: 1
  load_in_4bit: true
  fp16: true                        # T4 bf16 desteklemez; pilotta NaN kayıp izlenir

guard:
  max_change_ratio: null            # yalnızca doğrulama setinde ayarlanır

eval:
  beta: 0.5
  n_boot: 1000
  m2_timeout_seconds: 60            # M2 scorer çok değişmiş cümlelerde yavaşlayabilir
